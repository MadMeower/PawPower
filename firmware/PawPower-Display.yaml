# Waveshare display board: identity, network, pins and UI colors.
substitutions:
  name: pawpower-display
  friendly_name: Paw Power Display
  paw_color: '0x61E4AA'
  bolt_color: '0xFFD23F'
  background_color: '0x0C141E'
  card_color: '0x142230'
  text_color: '0xF1F6FB'
  muted_color: '0xA2B5C5'
  accent_color: '0x61E4AA'
  rs485_tx_pin: '44'
  rs485_rx_pin: '43'
  can_tx_pin: '15'
  can_rx_pin: '16'
  keypad_background_color: '0x123B2D'
  keypad_cancel_color: '0x52665D'
  keypad_apply_color: '0x61E4AA'
packages:
  common: !include 'pawpower_shared/core.yaml'
  screen_hardware: !include 'pawpower_shared/display-hardware.yaml'
  screen_ui: !include 'pawpower_shared/display-ui.yaml'
