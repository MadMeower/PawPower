# Shared battery bridge: edit once for both boards.
ota:
- platform: esphome
safe_mode: null
api:
  encryption:
    key: !secret 'shunt_api_key'
  reboot_timeout: 0s
debug:
  update_interval: 10s
preferences:
  flash_write_interval: 1s
time:
- platform: sntp
  id: battery_clock
  timezone: America/Detroit
uart:
  id: rs485_bus
  tx_pin: GPIO${rs485_tx_pin}
  rx_pin: GPIO${rs485_rx_pin}
  baud_rate: 115200
  debug:
    direction: RX
    dummy_receiver: true
    sequence:
    - lambda: !lambda |-
        static std::string line;
        static bool overflow = false;
        for (uint8_t byte : bytes) {
          if (byte == '\r') continue;
          if (byte != '\n') {
            if (!overflow && line.size() < 256) line += char(byte);
            else overflow = true;
            continue;
          }
          std::string message = line;
          line.clear();
          bool too_long = overflow;
          overflow = false;
          if (too_long || message.rfind(":r50=", 0) != 0) continue;
          std::vector<uint32_t> fields;
          size_t start = 5;
          bool valid = true;
          while (start < message.size()) {
            size_t end = message.find(',', start);
            if (end == std::string::npos) { valid = false; break; }
            std::string token = message.substr(start, end - start);
            if (token.empty() || token.size() > 10 ||
                token.find_first_not_of("0123456789") != std::string::npos) {
              valid = false;
              break;
            }
            unsigned long long value = strtoull(token.c_str(), nullptr, 10);
            if (value > 4294967295ULL) { valid = false; break; }
            fields.push_back(static_cast<uint32_t>(value));
            if (fields.size() > 14) { valid = false; break; }
            start = end + 1;
          }
          if (!valid || fields.size() != 14 || fields[0] != 1) { paw::pylon_control().reject(); continue; }
          uint64_t sum = 0;
          for (size_t i = 2; i < fields.size(); i++) sum += fields[i];
          if (fields[1] != (sum % 255) + 1) {
            ESP_LOGW("junctek", "Checksum mismatch");
            paw::pylon_control().reject();
            continue;
          }
          if (fields[11] > 1) { paw::pylon_control().reject(); continue; }
          float volts = fields[2] / 100.0f;
          float amps = fields[3] / 100.0f;
          if (fields[11] == 0) amps = -amps;
          float remaining = fields[4] / 1000.0f;
          float soc = fminf(100.0f, fmaxf(0.0f, remaining / paw::settings_store().get().v[paw::CAPACITY] * 100.0f));
          float temperature = static_cast<float>(fields[8]) - 100.0f;
          if (!paw::can_sample_valid(true, 0, volts, amps, soc, temperature)) {
          paw::pylon_control().reject(); continue;
        }
        paw::pylon_control().accept(millis(), volts, amps, soc, temperature);
          auto energy_now = id(battery_clock).now();
          paw::record_energy(id(battery_energy_store), millis(),
            energy_now.timestamp, energy_now.is_valid(), volts * amps);
          paw::record_peaks(id(battery_peak_store), energy_now.timestamp,
            energy_now.is_valid(), volts, amps);
          id(last_shunt_reply) = millis();
          id(have_shunt_reply) = true;
          id(battery_voltage).publish_state(volts);
          id(battery_current).publish_state(amps);
          id(battery_remaining_ah).publish_state(remaining);
          id(battery_soc).publish_state(soc);
          id(battery_temperature).publish_state(temperature);
          id(shunt_remaining_time).publish_state(fields[12]);
          id(shunt_data_age).publish_state(0);
          ESP_LOGD("junctek", "%.2f V, %.2f A, %.2f Ah, %.1f%%, %.1f C",
                   volts, amps, remaining, soc, temperature);
        }
switch:
- platform: template
  name: CAN Bench Output
  id: can_bench_output
  optimistic: true
  restore_mode: RESTORE_DEFAULT_OFF
  turn_on_action:
  - logger.log: 'CAN enabled: waiting for three fresh shunt replies; use an active 500 kbps peer'
  turn_off_action:
  - lambda: paw::pylon_transport().pause("Disabled");
web_server:
  port: 80
  auth:
    type: digest
    username: !secret 'paw_web_username'
    password: !secret 'paw_web_password'
  version: 2
  js_url: ''
  css_url: ''
  js_include: pawpower_shared/dashboard.js
  log: false
interval:
- interval: 1s
  then:
  - lambda: "auto now = id(battery_clock).now();\npaw::disconnect_tracker().tick(id(battery_disconnect_store), millis(),\n\
      \  now.timestamp, now.is_valid(), id(have_shunt_reply), id(last_shunt_reply));"
- interval: 1s
  then:
  - lambda: paw::pylon_transport().tick(millis(), id(can_bench_output).state);
- interval: 5s
  then:
  - uart.write:
      id: rs485_bus
      data: ":R50=1,2,1,\r\n"
sensor:
- platform: debug
  free:
    name: Heap Free
    id: heap_free
    unit_of_measurement: KiB
    accuracy_decimals: 1
    filters:
    - multiply: 0.0009765625
  block:
    name: Heap Largest Block
    id: heap_largest_block
    unit_of_measurement: KiB
    accuracy_decimals: 1
    filters:
    - multiply: 0.0009765625
  loop_time:
    name: Loop Time
    id: device_loop_time
- platform: template
  name: Battery Voltage
  id: battery_voltage
  unit_of_measurement: V
  device_class: voltage
  accuracy_decimals: 2
  update_interval: never
- platform: template
  name: Battery Current
  id: battery_current
  unit_of_measurement: A
  device_class: current
  accuracy_decimals: 2
  update_interval: never
- platform: template
  name: Battery Remaining Capacity
  id: battery_remaining_ah
  unit_of_measurement: Ah
  accuracy_decimals: 2
  update_interval: never
- platform: template
  name: Battery SOC
  id: battery_soc
  unit_of_measurement: '%'
  device_class: battery
  accuracy_decimals: 1
  update_interval: never
- platform: template
  name: Battery Temperature
  id: battery_temperature
  unit_of_measurement: °C
  device_class: temperature
  accuracy_decimals: 1
  update_interval: never
- platform: template
  name: Shunt Data Age
  id: shunt_data_age
  unit_of_measurement: s
  accuracy_decimals: 0
  update_interval: 1s
  lambda: 'if (!id(have_shunt_reply)) return -1.0f;

    return (uint32_t)(millis() - id(last_shunt_reply)) / 1000.0f;'
- platform: template
  name: Shunt Remaining Time
  id: shunt_remaining_time
  unit_of_measurement: min
  device_class: duration
  accuracy_decimals: 0
  update_interval: never
text_sensor:
- platform: template
  name: Battery Settings State
  id: battery_settings_state
  update_interval: 5s
  lambda: return paw::settings_store().json();
- platform: template
  name: Battery Energy History
  id: battery_energy_history
  update_interval: 10s
  lambda: 'auto now = id(battery_clock).now();

    return paw::energy_json(id(battery_energy_store), id(battery_peak_store), now.timestamp, now.is_valid());'
- platform: template
  name: Connection History
  id: battery_connection_history
  update_interval: 10s
  lambda: 'auto now = id(battery_clock).now();

    return paw::disconnect_json(id(battery_disconnect_store), now.timestamp, now.is_valid());'
- platform: template
  name: CAN Output Status
  id: can_output_status
  update_interval: 1s
  lambda: return paw::pylon_transport().status();
logger:
  level: DEBUG
wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.10.2
  includes:
  - pawpower_shared
  - <pawpower_shared/bridge.h>
  on_boot:
  - priority: -100
    then:
    - lambda: !lambda |-
        paw::settings_store().setup();
        paw::pylon_transport().setup(static_cast<gpio_num_t>(${can_tx_pin}), static_cast<gpio_num_t>(${can_rx_pin}));
  on_loop:
    then:
    - lambda: paw::pylon_transport().poll();
  on_shutdown:
    then:
    - lambda: paw::pylon_transport().pause("Shutdown");
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
      - driver
      - esp_driver_twai
globals:
- id: battery_energy_store
  type: std::array<uint8_t, 1536>
  restore_value: true
  initial_value: std::array<uint8_t, 1536>{}
  update_interval: 5min
- id: battery_peak_store
  type: std::array<uint8_t, 768>
  restore_value: true
  initial_value: std::array<uint8_t, 768>{}
  update_interval: 5min
- id: battery_disconnect_store
  type: std::array<uint8_t, 768>
  restore_value: true
  initial_value: std::array<uint8_t, 768>{}
  update_interval: 5min
- id: last_shunt_reply
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: have_shunt_reply
  type: bool
  restore_value: false
  initial_value: 'false'
text:
- platform: template
  name: Battery Settings Apply
  id: battery_settings_apply
  mode: text
  min_length: 1
  max_length: 255
  optimistic: false
  set_action:
  - lambda: !lambda |-
      if (paw::apply_profile(x)) id(battery_settings_apply).publish_state(x);
      id(battery_settings_state).publish_state(paw::settings_store().json());
