            bg_color: ${paw_color}
            bg_opa: 100%
            border_width: 0
            pad_all: 0
            clickable: false
            scrollable: false
        - obj:
            id: pp_battery_bean_4
            x: 11
            y: 21
            width: 24
            height: 19
            radius: 65535
            bg_color: ${paw_color}
            bg_opa: 100%
            border_width: 0
            pad_all: 0
            clickable: false
            scrollable: false
        - line:
            x: 16
            y: 20
            points:
            - 12, 0
            - 3, 9
            - 12, 9
            - 4, 19
            line_color: ${bolt_color}
            line_width: 3
            clickable: false
        on_click:
        - if:
            condition:
              lambda: !lambda |
                static unsigned taps = 0;
                static uint32_t started = 0;
                const uint32_t now = millis();
                if (taps == 0 || uint32_t(now - started) > 3000U) {
                  taps = 0;
                  started = now;
                }
                if (++taps >= 5) {
                  taps = 0;
                  return true;
                }
                return false;
            then:
            - lvgl.page.show:
                id: pp_cookie_page
                animation: NONE
