script:
- id: pp_load_settings
  then:
  - lambda: !lambda |-
      const auto &v = paw::settings_store().get().v;
      char text[32];
      std::snprintf(text, sizeof(text), "%.1f", v[0]);
      lv_textarea_set_text(id(pp_edit_capacity), text);
      std::snprintf(text, sizeof(text), "%.1f", v[5]);
      lv_textarea_set_text(id(pp_edit_charge_current), text);
      std::snprintf(text, sizeof(text), "%.1f", v[3]);
      lv_textarea_set_text(id(pp_edit_charge_voltage), text);
      std::snprintf(text, sizeof(text), "%.1f", v[1]);
      lv_textarea_set_text(id(pp_edit_stop_soc), text);
      std::snprintf(text, sizeof(text), "%.1f", (v[11] * 1.8f + 32.0f));
      lv_textarea_set_text(id(pp_edit_cold_stop), text);
      std::snprintf(text, sizeof(text), "%.1f", (v[12] * 1.8f + 32.0f));
      lv_textarea_set_text(id(pp_edit_cold_resume), text);
      std::snprintf(text, sizeof(text), "%.1f", (v[14] * 1.8f + 32.0f));
      lv_textarea_set_text(id(pp_edit_hot_stop), text);
      std::snprintf(text, sizeof(text), "%.1f", (v[15] * 1.8f + 32.0f));
      lv_textarea_set_text(id(pp_edit_hot_resume), text);
      std::snprintf(text, sizeof(text), "%.1f", v[2]);
      lv_textarea_set_text(id(pp_edit_resume_soc), text);
      std::snprintf(text, sizeof(text), "%.1f", v[4]);
      lv_textarea_set_text(id(pp_edit_hold_voltage), text);
      std::snprintf(text, sizeof(text), "%.1f", v[6]);
      lv_textarea_set_text(id(pp_edit_discharge_current), text);
      std::snprintf(text, sizeof(text), "%.1f", v[7]);
      lv_textarea_set_text(id(pp_edit_cutoff_voltage), text);
      std::snprintf(text, sizeof(text), "%.1f", v[8]);
      lv_textarea_set_text(id(pp_edit_recovery_voltage), text);
      std::snprintf(text, sizeof(text), "%.1f", v[9]);
      lv_textarea_set_text(id(pp_edit_warning_voltage), text);
      std::snprintf(text, sizeof(text), "%.1f", v[16]);
      lv_textarea_set_text(id(pp_edit_discharge_stop_soc), text);
      std::snprintf(text, sizeof(text), "%.1f", v[17]);
      lv_textarea_set_text(id(pp_edit_discharge_resume_soc), text);
      if (v[10] != 0) lv_obj_add_state(id(pp_edit_cold_enabled), LV_STATE_CHECKED); else lv_obj_remove_state(id(pp_edit_cold_enabled), LV_STATE_CHECKED);
      if (v[13] != 0) lv_obj_add_state(id(pp_edit_hot_enabled), LV_STATE_CHECKED); else lv_obj_remove_state(id(pp_edit_hot_enabled), LV_STATE_CHECKED);
      const char *message = paw::settings_store().confirmed() ? "Saved values loaded" : "Review defaults, then Save settings";
      lv_label_set_text(id(pp_preview_message), message);
      lv_label_set_text(id(pp_preview_message_advanced), message);
- id: pp_save_settings
  then:
  - lambda: !lambda |-
      auto &store = paw::settings_store();
      auto next = store.get();
      char *end = nullptr;
      const char *raw;
      float parsed;
      raw = lv_textarea_get_text(id(pp_edit_capacity));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: capacity");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: capacity");
        return;
      }
      next.v[0] = parsed;
      raw = lv_textarea_get_text(id(pp_edit_charge_current));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: charge current");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: charge current");
        return;
      }
      next.v[5] = parsed;
      raw = lv_textarea_get_text(id(pp_edit_charge_voltage));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: charge voltage");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: charge voltage");
        return;
      }
      next.v[3] = parsed;
      raw = lv_textarea_get_text(id(pp_edit_stop_soc));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: stop soc");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: stop soc");
        return;
      }
      next.v[1] = parsed;
      raw = lv_textarea_get_text(id(pp_edit_cold_stop));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: cold stop");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: cold stop");
        return;
      }
      next.v[11] = (parsed - 32.0f) / 1.8f;
      raw = lv_textarea_get_text(id(pp_edit_cold_resume));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: cold resume");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: cold resume");
        return;
      }
      next.v[12] = (parsed - 32.0f) / 1.8f;
      raw = lv_textarea_get_text(id(pp_edit_hot_stop));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: hot stop");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: hot stop");
        return;
      }
      next.v[14] = (parsed - 32.0f) / 1.8f;
      raw = lv_textarea_get_text(id(pp_edit_hot_resume));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: hot resume");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: hot resume");
        return;
      }
      next.v[15] = (parsed - 32.0f) / 1.8f;
      raw = lv_textarea_get_text(id(pp_edit_resume_soc));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: resume soc");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: resume soc");
        return;
      }
      next.v[2] = parsed;
      raw = lv_textarea_get_text(id(pp_edit_hold_voltage));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: hold voltage");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: hold voltage");
        return;
      }
      next.v[4] = parsed;
      raw = lv_textarea_get_text(id(pp_edit_discharge_current));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: discharge current");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: discharge current");
        return;
      }
      next.v[6] = parsed;
      raw = lv_textarea_get_text(id(pp_edit_cutoff_voltage));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: cutoff voltage");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: cutoff voltage");
        return;
      }
      next.v[7] = parsed;
      raw = lv_textarea_get_text(id(pp_edit_recovery_voltage));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: recovery voltage");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: recovery voltage");
        return;
      }
      next.v[8] = parsed;
      raw = lv_textarea_get_text(id(pp_edit_warning_voltage));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid number: warning voltage");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid number: warning voltage");
        return;
      }
      next.v[9] = parsed;
      raw = lv_textarea_get_text(id(pp_edit_discharge_stop_soc));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid discharge SOC");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid discharge SOC");
        return;
      }
      next.v[16] = parsed;
      raw = lv_textarea_get_text(id(pp_edit_discharge_resume_soc));
      parsed = std::strtof(raw, &end);
      if (raw == end || *end || !std::isfinite(parsed)) {
        lv_label_set_text(id(pp_preview_message), "Invalid discharge SOC");
        lv_label_set_text(id(pp_preview_message_advanced), "Invalid discharge SOC");
        return;
      }
      next.v[17] = parsed;
      next.v[10] = lv_obj_has_state(id(pp_edit_cold_enabled), LV_STATE_CHECKED) ? 1.0f : 0.0f;
      next.v[13] = lv_obj_has_state(id(pp_edit_hot_enabled), LV_STATE_CHECKED) ? 1.0f : 0.0f;
      std::string payload = std::to_string(store.revision()) + "|";
      char token[32];
      for (unsigned i = 0; i < paw::SETTING_COUNT; ++i) {
        if (i) payload += ",";
        std::snprintf(token, sizeof(token), "%.5f", next.v[i]);
        payload += token;
      }
      bool ok = paw::apply_profile(payload);
      id(battery_settings_state).publish_state(store.json());
      const char *message = ok ? "Saved to flash" : store.message().c_str();
      lv_label_set_text(id(pp_preview_message), message);
      lv_label_set_text(id(pp_preview_message_advanced), message);
- id: pp_refresh_live
  then:
  - lambda: !lambda |2

      const bool fresh = id(have_shunt_reply) && uint32_t(millis()-id(last_shunt_reply)) < 15000U;
      const auto &cfg = paw::settings_store().get().v;
      char b[192];
      std::snprintf(b,sizeof(b),"51.2V nominal | %.1fAh bank",cfg[paw::CAPACITY]);
      lv_label_set_text(id(pp_battery_bank),b); lv_label_set_text(id(pp_history_bank),b);
      const char *state=fresh?"Shunt connected":"Shunt not connected";
      lv_label_set_text(id(pp_battery_state),state);lv_label_set_text(id(pp_history_state),state);
      lv_label_set_text(id(pp_settings_state),state);lv_label_set_text(id(pp_settings_state_advanced),state);
      const float v=id(battery_voltage).state, a=id(battery_current).state, ah=id(battery_remaining_ah).state;
      const float soc=std::isfinite(ah)?fminf(100,fmaxf(0,ah/cfg[paw::CAPACITY]*100)):NAN;
      auto setnum=[&](lv_obj_t *label,const char *format,float value){if(fresh && std::isfinite(value)){std::snprintf(b,sizeof(b),format,value);lv_label_set_text(label,b);}else lv_label_set_text(label,"--");};
      setnum(id(pp_soc),"%.1f%%",soc);setnum(id(pp_remaining),"%.1f Ah remaining",ah);
      setnum(id(pp_voltage_value),"%.2f V",v);setnum(id(pp_current_value),"%+.2f A",a);
      setnum(id(pp_temp_value),"%.1f F",id(battery_temperature).state*1.8f+32);
      setnum(id(pp_power),"%.0f W",std::fabs(v*a));
      lv_label_set_text(id(pp_flow),!fresh?"NO SHUNT DATA":a>0.15f?"CHARGING":a< -0.15f?"DISCHARGING":"IDLE");
      lv_label_set_text(id(pp_flow_note),!fresh?"Waiting for valid RS485 replies":a>0.15f?"Power flowing into your battery bank":a< -0.15f?"Power flowing out of your battery bank":"Battery power is near zero");
      const auto flow=lv_color_hex(!fresh?0xA2B5C5:a>0.15f?0x61E4AA:a< -0.15f?0xFF7979:0xA2B5C5);
      lv_obj_set_style_text_color(id(pp_flow),flow,0);lv_obj_set_style_text_color(id(pp_power),flow,0);lv_obj_set_style_text_color(id(pp_current_value),flow,0);
      if(fresh && std::isfinite(soc)) {
        lv_arc_set_value(id(pp_soc_arc),int(soc*10));
        float f=fminf(1,fmaxf(0,(soc-20)/70));unsigned r,g;
        if(f<0.5f){r=255;g=unsigned(80+f*2*148);}else{r=unsigned(255-(f-0.5f)*2*158);g=228;}
        lv_obj_set_style_arc_color(id(pp_soc_arc),lv_color_hex((r<<16)|(g<<8)|80),LV_PART_INDICATOR);
      } else lv_arc_set_value(id(pp_soc_arc),0);
      static float draw=0,charge=0; static uint32_t sampled=0;
      if(fresh && sampled!=id(last_shunt_reply)) {
        sampled=id(last_shunt_reply);
        if(a< -0.15f) draw=draw>0?draw*0.8f+(-a)*0.2f:-a;
        if(a>0.15f) charge=charge>0?charge*0.8f+a*0.2f:a;
      }
      auto duration=[&](lv_obj_t *label,float hours){if(!fresh||!std::isfinite(hours)||hours<0){lv_label_set_text(label,"--");return;}if(hours>8760){lv_label_set_text(label,"> 1 year");return;}int m=int(hours*60+0.5f);std::snprintf(b,sizeof(b),"%dh %02dm",m/60,m%60);lv_label_set_text(label,b);};
      duration(id(pp_time_empty),draw>0?ah/draw:NAN);
      duration(id(pp_time_full),fresh && a>0.15f && charge>0?fmaxf(0,cfg[paw::CAPACITY]-ah)/charge:NAN);
      lv_label_set_text(id(pp_can_status),paw::pylon_transport().status().c_str());
      lv_label_set_text(id(pp_can_button_text),id(can_bench_output).state?"Disable CAN output":"Enable CAN output");
      std::snprintf(b,sizeof(b),"Heap %.1f KiB | Largest block %.1f KiB | Loop %.0f ms",id(heap_free).state,id(heap_largest_block).state,id(device_loop_time).state);
      lv_label_set_text(id(pp_device_stats),b);
      auto now=id(battery_clock).now();
      // Keep history buffers off the ESPHome task stack. Do not return/copy
      // these large structs by value inside the screen refresh lambda.
      static paw::EnergyStore store{};
      static paw::PeakStore peaks{};
      std::memcpy(&store, id(battery_energy_store).data(), sizeof(store));
      if (store.version != 1) {
        std::memset(&store, 0, sizeof(store));
        store.version = 1;
      }
      std::memcpy(&peaks, id(battery_peak_store).data(), sizeof(peaks));
      if (peaks.version != 1) {
        std::memset(&peaks, 0, sizeof(peaks));
        peaks.version = 1;
      }
      const paw::EnergyDay *today=nullptr;
      if(now.is_valid())today=paw::find(store,paw::date_key(now.timestamp));
      if(today){std::snprintf(b,sizeof(b),"%.2f kWh",today->charged_wh/1000);lv_label_set_text(id(pp_energy_value),b);}else lv_label_set_text(id(pp_energy_value),"--");
      for(int i=0;i<4;++i){
        const paw::EnergyDay *day=nullptr;int key=0;
        if(now.is_valid()){key=paw::date_key(paw::day_start(now.timestamp,-i));day=paw::find(store,key);}
        if(i<2){
          lv_obj_t *values=i==0?id(pp_day_values_0):id(pp_day_values_1);
          lv_obj_t *detail=i==0?id(pp_day_detail_0):id(pp_day_detail_1);
          if(day){std::snprintf(b,sizeof(b),"%.2f in / %.2f out",day->charged_wh/1000,day->discharged_wh/1000);lv_label_set_text(values,b);
            const auto *peak=paw::find_peak(peaks,key);
            if(peak)std::snprintf(b,sizeof(b),"Peak +%.0f / -%.0f W | %.1fh",peak->charge_w,peak->discharge_w,day->seconds/3600);
            else std::snprintf(b,sizeof(b),"%s | %.1fh recorded",day->partial?"Partial day":"Recorded",day->seconds/3600);
            lv_label_set_text(detail,b);
          }else{lv_label_set_text(values,"--");lv_label_set_text(detail,now.is_valid()?"No recorded data":"Waiting for clock");}
        }else if(i==2){
          if(day)std::snprintf(b,sizeof(b),"%04d-%02d-%02d   %.2f kWh in / %.2f out",key/10000,(key/100)%100,key%100,day->charged_wh/1000,day->discharged_wh/1000);
          else std::snprintf(b,sizeof(b),"Earlier days: no recorded data");
          lv_label_set_text(id(pp_history_row_1),b);
        }
      }
      std::snprintf(b,sizeof(b),"Shunt age: %s | More history on webpage",fresh?"fresh":"unavailable");lv_label_set_text(id(pp_history_row_2),b);
globals:
- id: pp_edit_index
  type: int
  restore_value: false
  initial_value: '0'
- id: pp_edit_advanced
  type: bool
  restore_value: false
  initial_value: 'false'
interval:
- interval: 1s
  then:
  - script.execute: pp_refresh_live
esphome:
  on_boot:
  - priority: -200
    then:
    - lambda: !lambda |-
        paw::settings_applied_hook() = [](){ id(pp_load_settings).execute(); };
    - script.execute: pp_load_settings
    - script.execute: pp_refresh_live
