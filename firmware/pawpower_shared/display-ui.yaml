# Optional touchscreen UI with Battery / Controls / History / Settings navigation.
lvgl:
  displays:
  - panel_display
  touchscreens:
  - panel_touch
  buffer_size: 25%
  default_font: montserrat_20
  pages:
  - id: pp_battery_page
    bg_color: ${background_color}
    pad_all: 0
    widgets:
    - label:
        id: pp_battery_brand
        text: Paw Power
        x: 74
        y: 15
        width: 320
        height: 36
        text_font: montserrat_28
        text_color: ${text_color}
    - label:
        id: pp_battery_bank
        text: 51.2V nominal | 1,120Ah bank
        x: 24
        y: 51
        width: 440
        height: 22
        text_font: montserrat_14
        text_color: ${muted_color}
    - label:
        id: pp_battery_state
        text: Shunt not connected
        x: 525
        y: 25
        width: 250
        height: 22
        text_font: montserrat_14
        text_color: ${accent_color}
        text_align: RIGHT
    - arc:
        id: pp_soc_arc
        x: 36
        y: 85
        width: 220
        height: 220
        min_value: 0
        max_value: 1000
        value: 0
        adjustable: false
        start_angle: 0
        end_angle: 360
        rotation: 270
        arc_color: 2833998
        arc_width: 12
        indicator:
          arc_color: ${accent_color}
          arc_width: 12
          arc_rounded: true
    - label:
        id: pp_soc
        text: Waiting for data
        x: 62
        y: 146
        width: 168
        height: 56
        text_font: montserrat_48
        text_color: ${text_color}
        text_align: CENTER
    - label:
        id: pp_soc_caption
