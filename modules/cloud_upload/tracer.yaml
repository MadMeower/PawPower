substitutions:
  cloud_device_token: !secret tracer_upload_token
  cloud_server_url: !secret pawpower_server_url
# Outbound HTTPS runs on a low-priority FreeRTOS task, not the ESPHome loop.
esphome:
  includes:
    # Explicit headers keep shunt-only controls out of Tracer builds.
    - cloud_upload/cloud_payload.h
    - cloud_upload/preferences_fragments.h
    - cloud_upload/cloud_uploader.h
    - tracer_shared/archive_cloud_sync.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            pawcloud::uploader().set_archive_source(&pawtracer::archive_cloud_next,&pawtracer::archive_cloud_accepted);
            pawcloud::uploader().set_uploads_enabled(id(paw_cloud_uploads_enabled).state);
esp32:
  framework:
    advanced:
      include_builtin_idf_components:
        - esp_http_client
    sdkconfig_options:
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: y
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL: y
json:
switch:
  - platform: template
    id: paw_cloud_uploads_enabled
    name: Cloud Uploads
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: pawcloud::uploader().set_uploads_enabled(true);
    turn_off_action:
      - lambda: pawcloud::uploader().set_uploads_enabled(false);
text:
  - platform: template
    name: Equipment Preferences Request
    id: paw_equipment_preferences_request
    entity_category: config
    mode: text
    min_length: 1
    max_length: 255
    optimistic: true
    set_action:
      - lambda: |-
          pawcloud::uploader().start(
              "${cloud_server_url}/api.php?action=upload&device=tracer",
              "${cloud_device_token}");
          pawcloud::uploader().request_equipment_configuration(x);
button:
  - platform: template
    name: Cloud Test Notification
    on_press:
      - lambda: |-
          pawcloud::uploader().start(
              "${cloud_server_url}/api.php?action=upload&device=tracer",
              "${cloud_device_token}");
          pawcloud::uploader().request_test();
text_sensor:
  - platform: template
    name: Equipment Preferences State
    update_interval: 2s
    lambda: return pawcloud::uploader().equipment_configuration();
  - platform: template
    name: Cloud History Status
    update_interval: 10s
    lambda: return std::string(pawcloud::uploader().history_status());
  - platform: template
    name: Cloud Test Status
    update_interval: 1s
    lambda: return pawcloud::uploader().test_status();
  - platform: template
    name: Cloud Upload Status
    update_interval: 10s
    lambda: return std::string(pawcloud::uploader().status());

interval:
  - interval: 1s
    then:
      - lambda: |-
          if(!id(paw_cloud_uploads_enabled).state)return;
          const auto &cloud=pawcloud::uploader();auto &log=pawdiag::history();
          const auto upload=cloud.upload_diagnostic();
          log.observe(6,32,upload,upload!=65535);
          const auto monitor=cloud.monitor_diagnostic(),history=cloud.history_diagnostic();
          log.observe(7,33,monitor==1?0:monitor,monitor!=0);
          log.observe(8,34,history==1?0:history,history!=0);
  - interval: 30s
    startup_delay: 25s
    then:
      - if:
          condition:
            and:
              - switch.is_on: paw_cloud_uploads_enabled
              - wifi.connected:
              - lambda: return id(tracer_clock).now().is_valid();
          then:
            - lambda: |-
                pawcloud::uploader().set_archive_source(&pawtracer::archive_cloud_next,&pawtracer::archive_cloud_accepted);
                if (!pawcloud::uploader().start(
                    "${cloud_server_url}/api.php?action=upload&device=tracer",
                    "${cloud_device_token}")) return;
                const auto now = millis();
                const auto &bus = pawtracer::bus();
                pawcloud::Payload body;
                const auto add = [&](const char *name, size_t field, float low, float high) {
                  const auto age = bus.age(field, now);
                  body.number(name, bus.values[field],
                      std::isfinite(age) && age <= 120.0f, low, high);
                };
                add("solar_voltage", pawtracer::Bus::PV_V, 0, 1500);
                add("solar_current", pawtracer::Bus::PV_A, 0, 2000);
                add("solar_watts", pawtracer::Bus::PV_W, 0, 100000);
                add("battery_voltage", pawtracer::Bus::BAT_V, 0, 1000);
                add("battery_current", pawtracer::Bus::BAT_A, -2000, 2000);
                add("battery_temperature_c", pawtracer::Bus::BAT_T, -100, 150);
                add("controller_temperature_c", pawtracer::Bus::CTRL_T, -100, 150);
                add("battery_soc", pawtracer::Bus::SOC, 0, 100);
                const auto clock = id(tracer_clock).now();
                auto store = paw::load_energy(id(tracer_energy_store));
                const auto *today = paw::find(store, paw::date_key(clock.timestamp));
                body.number("solar_kwh_today", today ? today->charged_wh / 1000.0 : NAN,
                    today != nullptr, 0, 10000);
                static unsigned history_day = 1;
                const auto peak_store = pawtracer::load(id(tracer_peak_store));
                const std::string ledger = esphome::json::build_json([&](JsonObject root) {
                  auto days = root["days"].to<JsonArray>();
                  for (unsigned index : {0U, history_day}) {
                    const auto &saved = store.days[index];
                    if (!saved.date) continue;
                    auto row = days.add<JsonObject>();
                    char date[32];  // Includes room for the full int formatting range.
                    snprintf(date, sizeof(date), "%04d-%02d-%02d", int(saved.date / 10000), int(saved.date / 100 % 100), int(saved.date % 100));
                    row["date"] = date; row["solar_kwh"] = saved.charged_wh / 1000.0;
                    row["seconds"] = saved.seconds; row["partial"] = saved.partial;
                    auto peak = row["peaks"].to<JsonObject>();
                    for (const auto &p : peak_store.days) if (p.date == saved.date) {
                      if (p.seen & 1) peak["solar_watts"] = p.watts;
                      if (p.seen & 2) peak["solar_amps"] = p.solar_amps;
                      if (p.seen & 4) { peak["charge_amps"] = p.charge_amps; peak["discharge_amps"] = p.discharge_amps; }
                      if (p.seen & 8) peak["controller_temperature_c"] = p.temperature;
                      break;
                    }
                  }
                });
                history_day = history_day % 30 + 1;
                const auto begin = ledger.find('['), end = ledger.rfind(']');
                pawcloud::uploader().submit(body.finish(), begin != std::string::npos && end != std::string::npos ?
                    ledger.substr(begin, end - begin + 1) : "[]", "", bus.equipment_json(now),
                    pawdiag::history().cloud_json(paw::date_key(paw::day_start(clock.timestamp,-int(history_day%6+1)))));
